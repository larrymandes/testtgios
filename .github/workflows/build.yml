name: CI

on:
  push:
    branches: [ master, teamgram, teamgram2 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          set -e
          ls -la /Applications/ | grep Xcode
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          else
            FIRST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -n 1)
            if [ -z "$FIRST_XCODE" ]; then
              echo "ERROR: Xcode not found"
              exit 1
            fi
            echo "Fallback to $FIRST_XCODE"
            sudo xcode-select -s "$FIRST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -e
          set -x
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios

      # Each run gets a new cache key. If the build fails, the partially
      # populated Bazel cache is saved and restored by the next run.
      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /private/var/tmp/_bazel_containerhost
            /Users/Shared/telegram-ios/build-input
          key: bazel-ios-${{ runner.arch }}-${{ hashFiles('versions.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bazel-ios-${{ runner.arch }}-${{ hashFiles('versions.json') }}-
            bazel-ios-${{ runner.arch }}-

      - name: Pre-download Bazel
        run: |
          set -e
          mkdir -p /Users/Shared/telegram-ios/build-input
          BAZEL_VERSION=$(python3 -c 'import json; print(json.load(open("/Users/Shared/telegram-ios/versions.json"))["bazel"].split(":")[0])')
          ARCH=$(uname -m)
          BAZEL_BIN="/Users/Shared/telegram-ios/build-input/bazel-${BAZEL_VERSION}-darwin-${ARCH}"
          if [ ! -f "$BAZEL_BIN" ]; then
            curl -fL "https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-darwin-${ARCH}" -o "$BAZEL_BIN"
            chmod +x "$BAZEL_BIN"
          fi
          ACTUAL_SHA=$(shasum -a 256 "$BAZEL_BIN" | awk '{print $1}')
          python3 -c "import json; p='/Users/Shared/telegram-ios/versions.json'; d=json.load(open(p)); d['bazel']='${BAZEL_VERSION}:'+ '$ACTUAL_SHA'; json.dump(d, open(p,'w'), indent=4)"

      - name: Patch provisioning profiles (expiry date, skip signature check)
        run: |
          set -e
          cd /Users/Shared/telegram-ios
          python3 - <<'PY'
          import glob, re

          # Extend the embedded fake provisioning profiles' expiry date.
          for p in glob.glob("build-system/fake-codesigning/**/*.mobileprovision", recursive=True):
              data = open(p, "rb").read()
              patched = re.sub(
                  rb"(<key>ExpirationDate</key>\s*<date>)202[0-9]-",
                  rb"\g<1>2030-",
                  data
              )
              open(p, "wb").write(patched)
              print("Patched:", p, "Changed:", data != patched)

          # The edit invalidates the CMS signature; skip signature verification.
          changed = 0
          for p in glob.glob("build-system/Make/*.py"):
              s = open(p).read()
              n = re.sub(
                  r"""(['"])-noverify\1""",
                  lambda m: m.group(0) + ", " + m.group(1) + "-nosigs" + m.group(1),
                  s
              )
              if n != s:
                  open(p, "w").write(n)
                  print("Patched", p)
                  changed += 1

          if not changed:
              raise SystemExit("ERROR: '-noverify' not found in build-system/Make")
          PY
          grep -rn -- "-nosigs" build-system/Make

      # Fix the TDLib CMake invocation and stop its wrapper from deleting
      # the intermediate CMake/OpenSSL build directories on every attempt.
      - name: Enable resumable TDLib compilation
        run: |
          set -e
          cd /Users/Shared/telegram-ios
          python3 - <<'PY'
          from pathlib import Path
          import re

          build_file = Path("third-party/td/BUILD")
          if not build_file.is_file():
              raise SystemExit(f"Missing {build_file}")

          build_text = build_file.read_text()
          build_text, removed = re.subn(
              r'(?m)^[ \t]*rm -rf "\$\$(?:BUILD_DIR|CMAKE_DIR|OPENSSL_DIR)"[ \t]*\n?',
              '',
              build_text
          )
          if removed != 3:
              raise SystemExit(
                  f"Expected to remove 3 TDLib cleanup commands, found {removed}. "
                  "The upstream BUILD file may have changed; refusing to patch blindly."
              )
          build_file.write_text(build_text)

          script = Path("third-party/td/build-td-bazel.sh")
          if not script.is_file():
              raise SystemExit(f"Missing {script}")

          script_text = script.read_text()

          # TDLib's CMake checks need the C++ flags to match the C flags.
          cxx_fix = 'export CXXFLAGS="$CFLAGS"'
          if cxx_fix not in script_text:
              marker = "# Common build steps"
              if marker not in script_text:
                  raise SystemExit(
                      "Cannot find '# Common build steps' in build-td-bazel.sh"
                  )
              script_text = script_text.replace(
                  marker, cxx_fix + "\n" + marker, 1
              )

          # Reuse existing directories and reset the generated toolchain file.
          script_text = script_text.replace("mkdir native-build", "mkdir -p native-build")
          script_text = script_text.replace("mkdir build", "mkdir -p build")
          script_text = script_text.replace("touch toolchain.cmake", ": > toolchain.cmake")

          if cxx_fix not in script_text:
              raise SystemExit("CXXFLAGS fix was not applied")
          script.write_text(script_text)

          print(f"TDLib cleanup commands removed: {removed}")
          print("TDLib CXXFLAGS and incremental directory handling enabled")
          PY

      - name: Build the App
        run: |
          set -e
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

                    python3 - <<'PY'
          import glob, plistlib, subprocess

          profiles = glob.glob(
              "build-system/fake-codesigning/**/*.mobileprovision",
              recursive=True
          )

          print(f"Found {len(profiles)} profiles")

          for path in sorted(profiles):
              print(f"\nPROFILE: {path}")
              raw = subprocess.check_output([
                  "openssl", "smime", "-inform", "der",
                  "-verify", "-noverify", "-nosigs", "-in", path
              ], stderr=subprocess.DEVNULL)

              start = raw.find(b"<?xml")
              profile = plistlib.loads(raw[start:])
              ent = profile.get("Entitlements", {})

              print("APP_ID:", ent.get("application-identifier"))
              print("APS:", ent.get("aps-environment"))
              print("TEAM:", profile.get("TeamIdentifier"))
          PY

          echo "Diagnostics complete. Skipping build."
          exit 1

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          IPA_PATH="bazel-bin/Telegram/Telegram.ipa"

          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: Telegram.ipa was not found"
            find -L bazel-bin bazel-out -type f -name "*.ipa" -print || true
            exit 1
          fi

          cp "$IPA_PATH" "$OUTPUT_PATH/Telegram.ipa"
          ls -lh "$OUTPUT_PATH"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Teamgram-iOS-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error

      # This runs even when the build step fails. The next workflow run
      # restores this cache using the restore-keys prefix above.
      - name: Save Bazel cache after build (including failures)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            /private/var/tmp/_bazel_containerhost
            /Users/Shared/telegram-ios/build-input
          key: bazel-ios-${{ runner.arch }}-${{ hashFiles('versions.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
